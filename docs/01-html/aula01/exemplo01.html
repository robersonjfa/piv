<!--
  Aula 01 — Exemplo mínimo (só HTML, sem CSS)
  Objetivo: ver a estrutura básica de uma página antes de estilizar.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Página simples: ainda sem link para CSS -->
  <meta charset="UTF-8">
  <title>Minha Primeira Página</title>
</head>
<body>

  <!-- Hierarquia de títulos: h1 > h2 > h3 ... -->
  <h1>Bem-vindo à Aula de HTML</h1>

  <p>Este é um parágrafo de exemplo.</p>

  <h2>Lista de Tópicos</h2>
  <!-- Lista não ordenada (marcadores) -->
  <ul>
    <li>O que é HTML</li>
    <li>Tags básicas</li>
    <li>Estrutura de uma página</li>
  </ul>

  <h2>Link útil</h2>
  <p>Você pode aprender mais sobre HTML no
    <!-- Links externos costumam usar https:// e target="_blank" -->
    <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML" target="_blank">MDN Web Docs</a>.
  </p>

</body>
</html>
