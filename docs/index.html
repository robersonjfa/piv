<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIV — Exemplos HTML</title>
  <style>
    :root {
      --ink: #14213d;
      --muted: #4a5568;
      --line: #d9e2ec;
      --bg: #f7fafc;
      --card: #ffffff;
      --accent: #1f4e79;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #e8f1fb 0%, transparent 40%),
        linear-gradient(180deg, var(--bg), #eef2f7 100%);
      min-height: 100vh;
      line-height: 1.5;
    }

    main {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }

    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0 0 2rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    a {
      display: block;
      padding: 1rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      color: var(--ink);
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }

    a strong {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
    }

    a span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>PIV — Exemplos HTML</h1>
    <p class="lead">Programação IV · material da trilha HTML/CSS</p>

    <ul>
      <li>
        <a href="01-html/aula01/">
          <strong>Aula 01</strong>
          <span>Primeiros exercícios de HTML e CSS</span>
        </a>
      </li>
      <li>
        <a href="01-html/exemplo01/">
          <strong>Exemplo 01</strong>
          <span>HTML, CSS e JS organizados em pastas</span>
        </a>
      </li>
      <li>
        <a href="01-html/meu-curriculo/">
          <strong>Meu currículo</strong>
          <span>Versão básica</span>
        </a>
      </li>
      <li>
        <a href="01-html/meu-curriculo-semantico/">
          <strong>Currículo semântico</strong>
          <span>HTML5 com tags semânticas</span>
        </a>
      </li>
    </ul>

    <footer>UNOESC · Ciência da Computação · Programação IV</footer>
  </main>
</body>
</html>
